# VideoNode Configuration File
# All settings can be overridden via environment variables
# using the format: VIDEONODE_<SECTION>_<KEY>
# For example: VIDEONODE_SERVER_PORT=:8080

[server]
# Port for the server to listen on
port = ":8090"

[streams]
# Configuration file for stream definitions
config_file = "streams.toml"

[streaming]
# RTSP server port
rtsp_port = ":8554"

[srt]
# SRT egress listener. The daemon is the sender; receivers (e.g. an OBS Media
# Source) connect as callers and pull MPEG-TS.
enabled = true
addr = ":6001"
# Peer latency in ms the listener demands of receivers. Negotiated as the max
# with the receiver's own latency, so this is a floor. Raise for WiFi/WAN
# (rule of thumb: >= 4x the round-trip time).
latency = 20
# Retransmit bandwidth headroom in percent (10-100). 25 covers up to ~10% loss;
# raise for lossy WiFi.
overhead_bw = 25
# Max send bandwidth in bytes/s: -1 unlimited, 0 = relative cap from input_bw.
max_bw = -1
# Expected input rate in bytes/s, used only when max_bw = 0.
input_bw = 0
# Payload size in bytes; 1316 = 7x188 keeps MPEG-TS packets aligned and under
# the WiFi/Ethernet MTU.
payload_size = 1316
# Idle timeout in ms before a silent peer is dropped. 5000 rides out brief
# WiFi stalls/roams without false disconnects.
peer_idle_timeout = 5000

[metrics]
# Enable SSE (Server-Sent Events) exporter
sse_enabled = true

[preview]
# Maximum fps for source/composer preview.mjpg streams. Per-request ?fps
# is clamped to [1, max_fps]. Default per-request fps is 1.
max_fps = 10

[vision]
# Default frame rate for the vision raw-frame pipe (per source).
# Per-source `vision.fps` in streams.toml overrides this. 0 = no throttle.
default_fps = 10

[auth]
# Authentication type: "linux" (default) or "basic"
# linux: Uses service user's Linux credentials via unix_chkpwd
# basic: Uses username/password below
type = "basic"
# Fallback credentials (used when type="basic" or linux auth unavailable)
username = "videonode"
password = "videonode"

[features]
# Enable LED control (requires appropriate hardware)
led_control_enabled = false


[logging]
# Global logging level (debug, info, warn, error)
level = "info"
# Logging format (text, json)
format = "text"
# Module-specific logging levels
streams = "info"
streaming = "debug"
devices = "info"
encoders = "info"
recording = "info"
api = "info"
webrtc = "debug"
srt = "debug"
