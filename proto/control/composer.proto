syntax = "proto3";

package videonode.control;

import "google/protobuf/empty.proto";
import "control/common.proto";

option go_package = "github.com/smazurov/videonode/internal/streams/pipelinectl/pb;controlpb";

// Composer is the gRPC service exposed by every videonode-composer
// binary over its per-instance Unix-domain socket. Composer is fully
// daemon-driven: argv is just --drm-device / --grpc-listen / --composer-id.
// Everything else (canvas dims, slot bindings, layout, effects,
// per-source state) arrives over this RPC surface.
//
// Composers do not push status today; if/when they do, add
// StreamStatus here mirroring source.proto.
service Composer {
  // Describe returns the composer's identity. First call after dial.
  rpc Describe(google.protobuf.Empty) returns (NativeInfo);

  // SetCanvas configures the output canvas. Must arrive before the
  // composer can render anything useful.
  rpc SetCanvas(SetCanvasRequest) returns (google.protobuf.Empty);

  // SetSource binds a slot to a SCM-publishing source.
  rpc SetSource(SetSourceRequest) returns (google.protobuf.Empty);

  // ClearSource unbinds a slot.
  rpc ClearSource(ClearSourceRequest) returns (google.protobuf.Empty);

  // SetLayout atomically replaces the composer's placement set.
  rpc SetLayout(SetLayoutRequest) returns (google.protobuf.Empty);

  // SetEffects atomically replaces the effect list bound to source_id.
  rpc SetEffects(SetEffectsRequest) returns (google.protobuf.Empty);

  // SetSourceState notifies the composer that a source's collapsed
  // health state changed. Composer applies the user warp only when
  // state is "live" or "transitioning".
  rpc SetSourceState(SetSourceStateRequest) returns (google.protobuf.Empty);

  // GetStats returns a point-in-time snapshot of the render loop's
  // counters: frames rendered, observed fps (last ~1s window), the
  // current canvas dimensions, and the SCM consumer count. Cheap;
  // intended for periodic polling by the daemon. Process uptime lives
  // in the Go process supervisor and is not duplicated here.
  rpc GetStats(google.protobuf.Empty) returns (ComposerStats);

  // Snapshot captures one rendered frame from the canvas loop and
  // returns the raw BGRA bytes plus dimensions. Cost is on-demand
  // (mmap + memcpy out of the canvas dma-buf on the gRPC thread),
  // not per produced frame.
  rpc Snapshot(ComposerSnapshotRequest) returns (ComposerSnapshotResponse);

  // Shutdown asks the composer to exit cleanly.
  rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message ComposerSnapshotRequest {}

message ComposerSnapshotResponse {
  // Tight-packed BGRA pixels: width * height * 4 bytes.
  bytes bgra = 1;
  uint32 width = 2;
  uint32 height = 3;
  // Source dma-buf pitch (>= width*4) — reported for callers that want
  // to know about padding the source had. The `bgra` bytes themselves
  // are always width-packed.
  uint32 pitch = 4;
  // Monotonically increasing index of the rendered frame.
  uint64 frame_idx = 5;
  // CLOCK_MONOTONIC nanoseconds at the moment Update stashed the ref.
  uint64 captured_at_ns = 6;
}

message ComposerStats {
  // Total frames the canvas loop has produced since the process started,
  // including the pre-ready solid-black frames. Monotonically increasing.
  uint64 frames_rendered = 1;
  // Frames observed in the most recent ~1s sampling window. 0 until the
  // first window closes.
  double fps_observed = 2;
  // Current canvas dimensions; 0 before the first SetCanvas + ready snapshot.
  uint32 canvas_w = 3;
  uint32 canvas_h = 4;
  uint32 canvas_fps = 5;
  // SCM consumer count. Always 0 in stdout-output mode.
  int32 consumer_count = 6;
}

message SetCanvasRequest {
  uint32 w = 1;
  uint32 h = 2;
  uint32 fps = 3;
}

message SetSourceRequest {
  // free-form slot identifier ("a", "b", ...)
  string slot = 1;
  // stable source identifier (matches the source's own --device-id)
  string source_id = 2;
  // Unix-socket path where the source's scm_rights_producer is listening
  string scm_path = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 fps = 6;
}

message ClearSourceRequest {
  string slot = 1;
}

message LayoutSlot {
  string slot = 1;
  // canvas pixel coordinates; x/y may be negative (clipped off-canvas).
  int32 x = 2;
  int32 y = 3;
  int32 w = 4;
  int32 h = 5;
}

message SetLayoutRequest {
  repeated LayoutSlot slots = 1;
}

// PerspectiveEffectParams holds an integer-pixel quadrilateral plus the
// snapshot dimensions used to normalize corners to UV [0,1].
message PerspectiveEffectParams {
  // TLx, TLy, TRx, TRy, BRx, BRy, BLx, BLy — exactly 8 ints, order fixed.
  repeated int32 corners = 1;
  int32 snapshot_w = 2;
  int32 snapshot_h = 3;
}

message Effect {
  // "perspective" (others reserved). Unknown types are logged + skipped.
  string type = 1;
  // Populated iff type == "perspective".
  PerspectiveEffectParams perspective = 2;
}

message SetEffectsRequest {
  string source_id = 1;
  // order-significant; composer applies in array order.
  repeated Effect effects = 2;
}

message SetSourceStateRequest {
  string source_id = 1;
  // "live" | "transitioning" | "placeholder"
  string state = 2;
}
