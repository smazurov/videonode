name: Release DEB

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm
    container: arm64v8/debian:trixie
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build + stage C++ binaries
        run: composer/scripts/build-deb-arm64.sh
        env:
          MODE: release-nfpm
      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64
          path: composer/build/deb-arm64/staging/bin/

  build-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build arm64 binary
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -tags ui_embed \
            -ldflags "-s -w \
              -X github.com/smazurov/videonode/internal/version.Version=${GITHUB_REF_NAME#v} \
              -X github.com/smazurov/videonode/internal/version.GitCommit=$(git rev-parse --short HEAD) \
              -X github.com/smazurov/videonode/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/smazurov/videonode/internal/version.BuildID=${GITHUB_RUN_ID}" \
            -o dist/videonode .
      - uses: actions/upload-artifact@v7
        with:
          name: go-arm64
          path: dist/videonode

  package-deb:
    needs: [build-native, build-go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: native-arm64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: go-arm64
          path: dist/
      - name: Install nfpm + lintian
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          sudo apt-get update -qq
          sudo apt-get install -y lintian
      - name: Build .deb
        run: |
          chmod +x dist/*
          gzip -9n -c packaging/changelog > dist/changelog.gz
          VERSION=${GITHUB_REF_NAME#v}
          GOARCH=arm64 VERSION=$VERSION \
            nfpm package --packager deb --target dist/
      - name: Lint .deb
        run: lintian --tag-display-limit 0 --suppress-tags statically-linked-binary dist/*.deb
      - name: Attach .deb to GitHub Release
        run: |
          # Wait for the release to be created by the Build workflow
          for i in $(seq 1 30); do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for release ${GITHUB_REF_NAME}... (attempt $i/30)"
            sleep 10
          done
          gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  publish-apt:
    needs: [package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist/
      - uses: morph027/apt-repo-action@v3
        id: apt-repo
        with:
          repo-name: videonode
          signing-key: ${{ secrets.APT_SIGNING_KEY }}
          codename: stable
          architectures: arm64
          import-from-repo-url: https://smazurov.github.io/videonode
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.apt-repo.outputs.dir }}
      - id: deploy
        uses: actions/deploy-pages@v5
