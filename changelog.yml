- semver: 4.0.0
  date: 2026-06-03T00:00:00Z
  packager: Stepan Mazurov <smazurov@gmail.com>
  changes:
    - commit: b22080f
      note: "new pipeline architecture: sources, composers, and streams are three independent top-level entities wired by explicit upstream refs, governed by a single pipeline master switch, with encoders that spawn lazily on the first reader and stop after the last"
    - commit: 1a42a4d
      note: "native RK3588 media pipeline: videonode-source/composer/sink processes move NV12 dma-bufs zero-copy over SCM_RIGHTS, with a libplacebo GPU compositor and an NV12-end-to-end path carrying colorimetry through to the encoder"
    - commit: c1a4d04
      note: "GPU composer with a live layout editor: multi-source compositing onto a canvas, a Region/Content model with per-slot rotation, crop, pan/zoom and fit, per-input perspective effects, configurable background, and edits that apply without restarting the pipeline — plus composer config TOML export/import"
    - commit: f412934
      note: "WebRTC playback via a WHEP egress endpoint with H265, fanning out alongside SRT and RTSP from the built-in local relay"
    - commit: cea24f4
      note: "RK3588 hardware acceleration end to end: hardware MJPEG decode through MPP, rkmpp encoders ingesting BGRA/RGB directly, and an S32_LE-capable audio capture path for the on-board ADC"
    - commit: 22fbdd1
      note: "rebuilt operational web UI on a single typed SSE entity stream: live pipeline/source/stream stats and sparklines, per-entity log panels, consumer counts and client IPs, process restart controls, an embedded WHEP player, and dead-rig detection"
    - commit: 55a842b
      note: "unified .deb packaging with a GitHub Pages APT repo, shadow-group-gated auth with postinst enrollment, and service auto-start on install — replacing goreleaser, the in-app self-update service, and install.sh"
    - commit: cdd37c1
      note: "VitePress documentation site with Mermaid diagrams, search, and versioned navigation"
  deb:
    urgency: low
    distributions:
      - stable

