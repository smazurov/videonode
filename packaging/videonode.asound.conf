# videonode ALSA capture config: plug -> dsnoop, mmap-backed hardware access.
#
# Raw hw:X,Y capture is garbage on RK3588 because ffmpeg's ALSA input only
# does RW access; dsnoop opens its slave hardware in mmap mode, which is what
# makes capture legible. plug sits on top so the card-native format (e.g. the
# Hollyland Lyra is S32_LE-only) is converted to whatever the encoder asks for.
#
# Parameterized by CARD/DEV; the daemon rewrites "hw:<n>,<m>" device strings to
# "vncap:CARD=<n>,DEV=<m>" before handing them to ffmpeg.
#
# ALSA_CONFIG_PATH REPLACES the default config tree, so pull in the system
# defaults first to keep hw/dsnoop/plug defined.
</usr/share/alsa/alsa.conf>

pcm.vndsnoop {
    @args [ CARD DEV ]
    @args.CARD { type string }
    @args.DEV { type integer default 0 }
    type dsnoop
    ipc_key 0x766e6420
    ipc_key_add_uid true
    slave {
        pcm {
            type hw
            card $CARD
            device $DEV
        }
        rate 48000
        channels 2
        period_size 2048
        buffer_size 32768
    }
    hw_ptr_alignment auto
}

pcm.vncap {
    @args [ CARD DEV ]
    @args.CARD { type string }
    @args.DEV { type integer default 0 }
    type plug
    slave.pcm {
        @func concat
        strings [ "vndsnoop:CARD=" $CARD ",DEV=" $DEV ]
    }
}
