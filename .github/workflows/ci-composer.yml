name: composer-ci

on:
  push:
    paths:
      - 'composer/**'
      - '.github/workflows/ci-composer.yml'
  pull_request:
    paths:
      - 'composer/**'
      - '.github/workflows/ci-composer.yml'

jobs:
  build-test-fedora:
    runs-on: ubuntu-26.04
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build pkgconf-pkg-config gcc-c++ \
            mesa-libEGL-devel mesa-libGLES-devel mesa-libgbm-devel \
            libdrm-devel rpm-build
      - name: Configure
        run: cmake -B build -S composer -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-test-ubuntu-arm64:
    runs-on: ubuntu-26.04-arm
    container: arm64v8/ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ ca-certificates \
            libegl-dev libgles-dev libgbm-dev libdrm-dev dpkg-dev
      - name: Configure
        run: cmake -B build -S composer -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    runs-on: ubuntu-26.04
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install lint deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build pkgconf-pkg-config gcc-c++ \
            mesa-libEGL-devel mesa-libGLES-devel mesa-libgbm-devel \
            libdrm-devel clang-tools-extra
      - name: Configure
        run: cmake -B build -S composer -G Ninja
      - name: Lint (clang-format check)
        run: cmake --build build --target lint
