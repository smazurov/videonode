      note: "SRT egress improvements for H265: subscribers joining between keyframes now get VPS/SPS/PPS prepended so the decoder starts immediately instead of stalling until the next IDR; the listener also gains tunable latency/bandwidth/idle-timeout knobs and aligns its payload to 1316 bytes (7x188) so MPEG-TS packets stay intact"
  deb:
    urgency: low
