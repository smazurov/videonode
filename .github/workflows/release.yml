name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 4.0.0-rc1). Omit the v prefix.'
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ inputs.version || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: go-arm64
          path: dist/videonode_linux_arm64/videonode

  build-native:
    runs-on: ubuntu-24.04-arm
    container: arm64v8/debian:trixie
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build + stage C++ binaries
        run: composer/scripts/build-deb-arm64.sh
        env:
          MODE: release-nfpm
      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64
          path: composer/build/deb-arm64/staging/bin/

  package-deb:
    needs: [goreleaser, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: go-arm64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: native-arm64
          path: dist/
      - name: Install nfpm + lintian
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          sudo apt-get update -qq
          sudo apt-get install -y lintian
      - name: Build .deb
        run: |
          chmod +x dist/videonode dist/videonode-source dist/videonode-sink dist/videonode-composer
          gzip -9n -c packaging/changelog > dist/changelog.gz
          VER="${VERSION#v}"
          GOARCH=arm64 VERSION=$VER \
            nfpm package --packager deb --target dist/
      - name: Lint .deb
        run: lintian --tag-display-limit 0 --suppress-tags statically-linked-binary dist/*.deb
      - name: Attach .deb to GitHub Release
        run: |
          TAG="v${VERSION#v}"
          gh release upload "$TAG" dist/*.deb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  publish-apt:
    needs: [package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist/
      - uses: morph027/apt-repo-action@v3
        id: apt-repo
        with:
          repo-name: videonode
          signing-key: ${{ secrets.APT_SIGNING_KEY }}
          codename: stable
          architectures: arm64
          import-from-repo-url: https://smazurov.github.io/videonode
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.apt-repo.outputs.dir }}
      - id: deploy
        uses: actions/deploy-pages@v5
