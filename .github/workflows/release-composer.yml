name: composer-release

on:
  push:
    tags:
      - 'native-v*'

jobs:
  deb-arm64:
    runs-on: ubuntu-24.04-arm
    container: arm64v8/debian:trixie
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build + pack DEB (release-deb)
        run: composer/scripts/build-deb-arm64.sh
      - uses: actions/upload-artifact@v6
        with:
          name: deb-arm64
          path: composer/build/deb-arm64/*.deb

  release:
    needs: [deb-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/deb-arm64/*.deb
          generate_release_notes: true
