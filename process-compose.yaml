version: "0.5"

processes:
  # Backend with hot reload (includes embedded RTSP server)
  backend:
    command: "air"
    availability:
      restart: "on_failure"

  # Frontend dev server
  frontend:
    command: "node_modules/.bin/vite"
    working_dir: "./ui"
    depends_on:
      backend:
        condition: process_started
    availability:
      restart: "on_failure"

  # Design system preview (Ladle) — http://localhost:61000/
  ladle:
    command: "node_modules/.bin/ladle serve"
    working_dir: "./ui"
    availability:
      restart: "on_failure"

  # Documentation site (VitePress) — http://localhost:5173/videonode/
  docs:
    command: "node_modules/.bin/vitepress dev docs --host 0.0.0.0"
    working_dir: "./website"
    availability:
      restart: "on_failure"
