name: videonode
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: video
priority: optional
maintainer: Stepan Mazurov <smazurov@gmail.com>
description: |
  RK3588 video streaming server with native dma-buf pipeline.
  Turns V4L2 capture devices into RTSP, WebRTC, and SRT streams
  with GPU-accelerated compositing via EGL/GLES on Mali-G610.
vendor: Stepan Mazurov
homepage: https://github.com/smazurov/videonode
license: AGPL-3.0-or-later

# Runtime libraries the native binaries dlopen/link against. The C++ side
# (videonode-source/-sink/-composer) links gRPC, protobuf, abseil, libplacebo
# and turbojpeg in addition to the EGL/GLES/GBM/DRM stack — without these the
# binaries fail at startup with "cannot open shared object file". Package names
# and soname suffixes are bookworm-specific; bump them if the build base moves.
# librga / librockchip_mpp are board-specific (not in Debian) and provided by
# install-rockchip-libs.sh / the Armbian image, so they are not declared here.
depends:
  - libc6
  - libstdc++6
  - libegl1
  - libgles2
  - libgbm1
  - libdrm2
  - libgrpc++1.51
  - libprotobuf32
  - libabsl20220623
  - libplacebo208
  - libturbojpeg0

contents:
  - src: ./dist/videonode
    dst: /usr/bin/videonode
    file_info:
      mode: 0755

  - src: ./dist/videonode-source
    dst: /usr/bin/videonode-source
    file_info:
      mode: 0755

  - src: ./dist/videonode-sink
    dst: /usr/bin/videonode-sink
    file_info:
      mode: 0755

  - src: ./dist/videonode-composer
    dst: /usr/bin/videonode-composer
    file_info:
      mode: 0755

  - src: ./packaging/videonode.service
    dst: /usr/lib/systemd/system/videonode.service

  - src: ./packaging/videonode.sysusers
    dst: /usr/lib/sysusers.d/videonode.conf

  - src: ./packaging/videonode.tmpfiles
    dst: /usr/lib/tmpfiles.d/videonode.conf

  - src: ./packaging/config.toml
    dst: /etc/videonode/config.toml
    type: config

  - src: ./packaging/copyright
    dst: /usr/share/doc/videonode/copyright

changelog: ./changelog.yml

scripts:
  postinstall: ./packaging/postinst.sh
  preremove: ./packaging/prerm.sh
  postremove: ./packaging/postrm.sh

