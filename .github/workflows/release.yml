name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 4.0.0-rc1). Omit the v prefix.'
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            native: true
    runs-on: ${{ matrix.runner }}
    container: arm64v8/debian:trixie
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags

      # Go + UI
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build Go binary
        run: |
          VER="${VERSION#v}"
          CGO_ENABLED=0 go build \
            -tags ui_embed \
            -ldflags "-s -w \
              -X github.com/smazurov/videonode/internal/version.Version=${VER} \
              -X github.com/smazurov/videonode/internal/version.GitCommit=$(git rev-parse --short HEAD) \
              -X github.com/smazurov/videonode/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/smazurov/videonode/internal/version.BuildID=${GITHUB_RUN_ID}" \
            -o dist/videonode .

      # Native C++ (only on platforms with native pipeline)
      - name: Build native binaries
        if: matrix.native
        run: composer/scripts/build-deb-arm64.sh
        env:
          MODE: release-nfpm
      - name: Stage native binaries
        if: matrix.native
        run: cp composer/build/deb-arm64/staging/bin/* dist/

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: dist/

  package-deb:
    needs: [build]
    strategy:
      matrix:
        include:
          - arch: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.arch }}
          path: dist/
      - name: Install nfpm + lintian
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          sudo apt-get update -qq
          sudo apt-get install -y lintian
      - name: Build .deb
        run: |
          chmod +x dist/videonode dist/videonode-source dist/videonode-sink dist/videonode-composer
          VER="${VERSION#v}"
          GOARCH=${{ matrix.arch }} VERSION=$VER \
            nfpm package --packager deb --target dist/
      - name: Lint .deb
        run: lintian --tag-display-limit 0 --suppress-tags statically-linked-binary dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  publish-release:
    needs: [package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
      - name: Render release notes
        run: |
          go install github.com/goreleaser/chglog/cmd/chglog@latest
          TAG="v${VERSION#v}"
          chglog add --version "$TAG" --output changelog.yml 2>/dev/null || true
          chglog format --template release --version "$TAG" --output RELEASE_NOTES.md || true
          cat RELEASE_NOTES.md 2>/dev/null || echo "Release ${TAG}" > RELEASE_NOTES.md
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist/
      - name: Create GitHub Release
        run: |
          TAG="v${VERSION#v}"
          gh release create "$TAG" dist/*.deb \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            ${{ contains(env.VERSION, 'rc') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-apt:
    needs: [package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist/
      - uses: morph027/apt-repo-action@v3
        id: apt-repo
        with:
          repo-name: videonode
          signing-key: ${{ secrets.APT_SIGNING_KEY }}
          codename: stable
          architectures: arm64
          import-from-repo-url: https://mazurov.dev/videonode
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.apt-repo.outputs.dir }}
      - id: deploy
        uses: actions/deploy-pages@v5
