name: Release DEB

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

concurrency:
  group: release-deb-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-native:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04-arm
    container: arm64v8/debian:trixie
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build + stage C++ binaries
        run: composer/scripts/build-deb-arm64.sh
        env:
          MODE: release-nfpm
      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64
          path: composer/build/deb-arm64/staging/bin/

  build-go:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build arm64 binary
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -tags ui_embed \
            -ldflags "-s -w \
              -X github.com/smazurov/videonode/internal/version.Version=${TAG#v} \
              -X github.com/smazurov/videonode/internal/version.GitCommit=${SHA::7} \
              -X github.com/smazurov/videonode/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X github.com/smazurov/videonode/internal/version.BuildID=${RUN_ID}" \
            -o dist/videonode .
      - uses: actions/upload-artifact@v7
        with:
          name: go-arm64
          path: dist/videonode

  package-deb:
    needs: [build-native, build-go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: native-arm64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: go-arm64
          path: dist/
      - name: Install nfpm + lintian
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          sudo apt-get update -qq
          sudo apt-get install -y lintian
      - name: Build .deb
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          chmod +x dist/videonode dist/videonode-source dist/videonode-sink dist/videonode-composer
          gzip -9n -c packaging/changelog > dist/changelog.gz
          VERSION=${TAG#v}
          GOARCH=arm64 VERSION=$VERSION \
            nfpm package --packager deb --target dist/
      - name: Lint .deb
        run: lintian --tag-display-limit 0 --suppress-tags statically-linked-binary dist/*.deb
      - name: Attach .deb to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: gh release upload "$TAG" dist/*.deb --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  publish-apt:
    needs: [package-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist/
      - uses: morph027/apt-repo-action@v3
        id: apt-repo
        with:
          repo-name: videonode
          signing-key: ${{ secrets.APT_SIGNING_KEY }}
          codename: stable
          architectures: arm64
          import-from-repo-url: https://smazurov.github.io/videonode
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.apt-repo.outputs.dir }}
      - id: deploy
        uses: actions/deploy-pages@v5
